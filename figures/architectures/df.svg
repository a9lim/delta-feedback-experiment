<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950" role="img" aria-labelledby="df-·-delta-feedback-title df-·-delta-feedback-desc">
<title id="df-·-delta-feedback-title">DF · Delta Feedback</title>
<desc id="df-·-delta-feedback-desc">The previous payload and token embedding are fused into u. The fused input seeds DAR-style routing throughout the stack. A dedicated router enriches the top state with a delta-only mixture before forming the next payload.</desc>
<defs>
  <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563a8"/></marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
  <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c86b08"/></marker>
  <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  <style>
    .canvas { fill: #ffffff; }
    .title { font: 600 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526070; }
    .section { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .label { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526070; }
    .formula { font: 500 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #172033; }
    .sum-label { font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .node { stroke-width: 2; }
    .neutral { fill: #f7f9fc; stroke: #9aa7b7; }
    .blue-node { fill: #eaf2ff; stroke: #2563a8; }
    .purple-node { fill: #f2ebff; stroke: #7c3aed; }
    .orange-node { fill: #fff2df; stroke: #c86b08; }
    .green-node { fill: #e5f7f0; stroke: #138a66; }
    .gray-node { fill: #eef2f6; stroke: #64748b; }
    .stack { fill: #fbfcfe; stroke: #9aa7b7; stroke-width: 2; }
    .sum { fill: #ffffff; stroke: #2563a8; stroke-width: 2; }
    .edge { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .blue { stroke: #2563a8; }
    .purple { stroke: #7c3aed; }
    .orange { stroke: #c86b08; }
    .gray { stroke: #64748b; }
    .divider { stroke: #d5dce6; stroke-width: 1.5; }
  </style>
</defs>
<rect class="canvas" width="1700" height="950"/>
<text class="title" x="60" y="62.0" text-anchor="start"><tspan x="60" y="62.0">DF · Delta Feedback</tspan></text>
<text class="subtitle" x="60" y="101.0" text-anchor="start"><tspan x="60" y="101.0">Hard combination · gated horizontal feedback + mandatory vertical delta routing</tspan></text>
<line class="divider" x1="60" y1="132" x2="1640" y2="132"/>
<rect class="node orange-node" x="45" y="235" width="190" height="88" rx="16"/><text class="formula" x="140.0" y="269.0" text-anchor="middle"><tspan x="140.0" y="269.0">Previous payload</tspan><tspan x="140.0" y="291.0">pₜ₋₁</tspan></text>
<rect class="node neutral" x="45" y="507" width="120" height="72" rx="16"/><text class="formula" x="105.0" y="533.0" text-anchor="middle"><tspan x="105.0" y="533.0">Token</tspan><tspan x="105.0" y="555.0">xₜ</tspan></text>
<line class="edge blue" x1="165" y1="543" x2="198" y2="543" marker-end="url(#arrow-blue)"/>
<rect class="node blue-node" x="200" y="499" width="190" height="88" rx="16"/><text class="formula" x="295.0" y="533.0" text-anchor="middle"><tspan x="295.0" y="533.0">Embedding</tspan><tspan x="295.0" y="555.0">eₜ</tspan></text>
<rect class="node orange-node" x="270" y="354" width="190" height="126" rx="16"/><text class="small" x="365.0" y="385.0" text-anchor="middle"><tspan x="365.0" y="385.0">Asymmetric GLU</tspan><tspan x="365.0" y="407.0">value: Wᵤpₜ₋₁</tspan><tspan x="365.0" y="429.0">gate: σ(Wɢ·norm(eₜ))</tspan><tspan x="365.0" y="451.0">RMSNorm → uₜ</tspan></text>
<path class="edge orange" d="M 235 279 L 365 279 L 365 352" marker-end="url(#arrow-orange)"/>
<path class="edge blue" d="M 390 543 L 430 543 L 430 482" marker-end="url(#arrow-blue)"/>
<line class="edge orange" x1="460" y1="417" x2="498" y2="417" marker-end="url(#arrow-orange)"/>
<text class="formula" x="479" y="392.0" text-anchor="middle"><tspan x="479" y="392.0">uₜ</tspan></text>
<rect class="stack" x="500" y="205" width="680" height="500" rx="24"/>
<text class="section" x="528" y="243.0" text-anchor="start"><tspan x="528" y="243.0">Transformer block ℓ   × L</tspan></text>
<text class="small" x="1152" y="243.0" text-anchor="end"><tspan x="1152" y="243.0">pre-norm residual trunk</tspan></text>
<text class="formula" x="535" y="421.0" text-anchor="middle"><tspan x="535" y="421.0">hℓ</tspan></text>
<line class="edge blue" x1="518" y1="444" x2="600" y2="444" marker-end="url(#arrow-blue)"/>
<rect class="node blue-node" x="600" y="396" width="190" height="96" rx="16"/><text class="label" x="695.0" y="434.0" text-anchor="middle"><tspan x="695.0" y="434.0">RMSNorm(h + route)</tspan><tspan x="695.0" y="456.0">Attention → Δaℓ</tspan></text>
<line class="edge blue" x1="790" y1="444" x2="822" y2="444" marker-end="url(#arrow-blue)"/>
<circle class="sum" cx="844" cy="444" r="19"/><text class="sum-label" x="844" y="450.0" text-anchor="middle"><tspan x="844" y="450.0">+</tspan></text>
<line class="edge blue" x1="863" y1="444" x2="890" y2="444" marker-end="url(#arrow-blue)"/>
<rect class="node blue-node" x="890" y="396" width="190" height="96" rx="16"/><text class="label" x="985.0" y="434.0" text-anchor="middle"><tspan x="985.0" y="434.0">RMSNorm(h + route)</tspan><tspan x="985.0" y="456.0">MLP → Δmℓ</tspan></text>
<line class="edge blue" x1="1080" y1="444" x2="1107" y2="444" marker-end="url(#arrow-blue)"/>
<circle class="sum" cx="1128" cy="444" r="19"/><text class="sum-label" x="1128" y="450.0" text-anchor="middle"><tspan x="1128" y="450.0">+</tspan></text>
<line class="edge blue" x1="1147" y1="444" x2="1210" y2="444" marker-end="url(#arrow-blue)"/>
<text class="formula" x="1150" y="421.0" text-anchor="middle"><tspan x="1150" y="421.0">hℓ₊₁</tspan></text>
<rect class="node purple-node" x="615" y="276" width="160" height="68" rx="16"/><text class="label" x="695.0" y="300.0" text-anchor="middle"><tspan x="695.0" y="300.0">Route</tspan><tspan x="695.0" y="322.0">qattn,ℓ</tspan></text>
<rect class="node purple-node" x="905" y="276" width="160" height="68" rx="16"/><text class="label" x="985.0" y="300.0" text-anchor="middle"><tspan x="985.0" y="300.0">Route</tspan><tspan x="985.0" y="322.0">qmlp,ℓ</tspan></text>
<line class="edge purple" x1="695" y1="344" x2="695" y2="394" marker-end="url(#arrow-purple)"/>
<line class="edge purple" x1="985" y1="344" x2="985" y2="394" marker-end="url(#arrow-purple)"/>
<rect class="node purple-node" x="572" y="570" width="536" height="92" rx="16"/><text class="formula" x="840.0" y="606.0" text-anchor="middle"><tspan x="840.0" y="606.0">Sℓ = [uₜ, Δa₀, Δm₀, …]</tspan><tspan x="840.0" y="628.0">fused seed + prior deltas; first attention no-ops</tspan></text>
<path class="edge purple" d="M 650 570 L 650 310 L 613 310" marker-end="url(#arrow-purple)"/>
<path class="edge purple" d="M 1030 570 L 1030 310 L 1067 310" marker-end="url(#arrow-purple)"/>
<path class="edge purple" d="M 740 492 L 740 535 L 805 535 L 805 568" stroke-dasharray="8 7" marker-end="url(#arrow-purple)"/>
<path class="edge purple" d="M 1030 492 L 1030 535 L 1000 535 L 1000 568" stroke-dasharray="8 7" marker-end="url(#arrow-purple)"/>
<text class="small" x="840" y="548.0" text-anchor="middle"><tspan x="840" y="548.0">append Δaℓ, Δmℓ</tspan></text>
<path class="edge purple" d="M 460 468 L 475 468 L 475 615 L 570 615" marker-end="url(#arrow-purple)"/>
<text class="small" x="475" y="590.0" text-anchor="middle"><tspan x="475" y="590.0">seed S₀ = [uₜ]</tspan></text>
<rect class="node blue-node" x="1215" y="397" width="190" height="94" rx="16"/><text class="formula" x="1310.0" y="434.0" text-anchor="middle"><tspan x="1310.0" y="434.0">Top state</tspan><tspan x="1310.0" y="456.0">hₜᵗᵒᵖ</tspan></text>
<line class="edge blue" x1="1180" y1="444" x2="1213" y2="444" marker-end="url(#arrow-blue)"/>
<rect class="node green-node" x="1460" y="382" width="195" height="124" rx="16"/><text class="label" x="1557.5" y="423.0" text-anchor="middle"><tspan x="1557.5" y="423.0">Final RMSNorm</tspan><tspan x="1557.5" y="445.0">+ tied LM head</tspan><tspan x="1557.5" y="467.0">→ logitsₜ</tspan></text>
<line class="edge blue" x1="1405" y1="444" x2="1458" y2="444" marker-end="url(#arrow-blue)"/>
<rect class="node purple-node" x="535" y="760" width="250" height="76" rx="16"/><text class="formula" x="660.0" y="788.0" text-anchor="middle"><tspan x="660.0" y="788.0">[Δa₀, Δm₀, …]</tspan><tspan x="660.0" y="810.0">deltas only</tspan></text>
<line class="edge purple" x1="785" y1="798" x2="827" y2="798" marker-end="url(#arrow-purple)"/>
<rect class="node purple-node" x="830" y="760" width="165" height="76" rx="16"/><text class="formula" x="912.5" y="788.0" text-anchor="middle"><tspan x="912.5" y="788.0">Payload route</tspan><tspan x="912.5" y="810.0">qₚ</tspan></text>
<line class="edge purple" x1="995" y1="798" x2="1036" y2="798" marker-end="url(#arrow-purple)"/>
<circle class="sum" cx="1060" cy="798" r="19"/><text class="sum-label" x="1060" y="804.0" text-anchor="middle"><tspan x="1060" y="804.0">+</tspan></text>
<path class="edge blue" d="M 1310 491 L 1310 730 L 1060 730 L 1060 777" marker-end="url(#arrow-blue)"/>
<text class="small" x="1165" y="716.0" text-anchor="middle"><tspan x="1165" y="716.0">+ base hₜᵗᵒᵖ</tspan></text>
<line class="edge orange" x1="1079" y1="798" x2="1120" y2="798" marker-end="url(#arrow-orange)"/>
<rect class="node orange-node" x="1122" y="760" width="150" height="76" rx="16"/><text class="formula" x="1197.0" y="788.0" text-anchor="middle"><tspan x="1197.0" y="788.0">RMSNorm</tspan><tspan x="1197.0" y="810.0">pₜ</tspan></text>
<line class="edge orange" x1="1272" y1="798" x2="1325" y2="798" marker-end="url(#arrow-orange)"/>
<rect class="node orange-node" x="1327" y="760" width="190" height="76" rx="16"/><text class="label" x="1422.0" y="788.0" text-anchor="middle"><tspan x="1422.0" y="788.0">Carry to</tspan><tspan x="1422.0" y="810.0">step t+1</tspan></text>
<line class="divider" x1="60" y1="884" x2="1640" y2="884"/>
<text class="small" x="60" y="918.0" text-anchor="start"><tspan x="60" y="918.0">Hard-everywhere: neither the routed reads nor the recurrent payload has a null escape.</tspan></text>
</svg>
