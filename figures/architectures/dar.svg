<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950" role="img" aria-labelledby="dar-·-delta-attention-residuals-title dar-·-delta-attention-residuals-desc">
<title id="dar-·-delta-attention-residuals-title">DAR · Delta Attention Residuals</title>
<desc id="dar-·-delta-attention-residuals-desc">The embedding seeds a source bank. Before every attention and MLP sublayer, a zero-initialized query routes over the seed and prior sublayer deltas. The routed mixture enriches the read transiently while the residual stream remains clean.</desc>
<defs>
  <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563a8"/></marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
  <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c86b08"/></marker>
  <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  <style>
    .canvas { fill: #ffffff; }
    .title { font: 600 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526070; }
    .section { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .label { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526070; }
    .formula { font: 500 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #172033; }
    .sum-label { font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .node { stroke-width: 2; }
    .neutral { fill: #f7f9fc; stroke: #9aa7b7; }
    .blue-node { fill: #eaf2ff; stroke: #2563a8; }
    .purple-node { fill: #f2ebff; stroke: #7c3aed; }
    .orange-node { fill: #fff2df; stroke: #c86b08; }
    .green-node { fill: #e5f7f0; stroke: #138a66; }
    .gray-node { fill: #eef2f6; stroke: #64748b; }
    .stack { fill: #fbfcfe; stroke: #9aa7b7; stroke-width: 2; }
    .sum { fill: #ffffff; stroke: #2563a8; stroke-width: 2; }
    .edge { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .blue { stroke: #2563a8; }
    .purple { stroke: #7c3aed; }
    .orange { stroke: #c86b08; }
    .gray { stroke: #64748b; }
    .divider { stroke: #d5dce6; stroke-width: 1.5; }
  </style>
</defs>
<rect class="canvas" width="1700" height="950"/>
<text class="title" x="60" y="62.0" text-anchor="start"><tspan x="60" y="62.0">DAR · Delta Attention Residuals</tspan></text>
<text class="subtitle" x="60" y="101.0" text-anchor="start"><tspan x="60" y="101.0">Vertical-axis widening · transient reads over the current column’s decomposition</tspan></text>
<line class="divider" x1="60" y1="132" x2="1640" y2="132"/>
<rect class="node neutral" x="45" y="479" width="120" height="72" rx="16"/><text class="formula" x="105.0" y="505.0" text-anchor="middle"><tspan x="105.0" y="505.0">Token</tspan><tspan x="105.0" y="527.0">xₜ</tspan></text>
<line class="edge blue" x1="165" y1="515" x2="202" y2="515" marker-end="url(#arrow-blue)"/>
<rect class="node blue-node" x="205" y="471" width="210" height="88" rx="16"/><text class="formula" x="310.0" y="505.0" text-anchor="middle"><tspan x="310.0" y="505.0">Token embedding</tspan><tspan x="310.0" y="527.0">eₜ</tspan></text>
<line class="edge blue" x1="415" y1="515" x2="498" y2="515" marker-end="url(#arrow-blue)"/>
<rect class="stack" x="500" y="205" width="680" height="500" rx="24"/>
<text class="section" x="528" y="243.0" text-anchor="start"><tspan x="528" y="243.0">Transformer block ℓ   × L</tspan></text>
<text class="small" x="1152" y="243.0" text-anchor="end"><tspan x="1152" y="243.0">pre-norm residual trunk</tspan></text>
<text class="formula" x="536" y="488.0" text-anchor="middle"><tspan x="536" y="488.0">hℓ</tspan></text>
<line class="edge blue" x1="518" y1="515" x2="600" y2="515" marker-end="url(#arrow-blue)"/>
<rect class="node blue-node" x="600" y="467" width="200" height="96" rx="16"/><text class="label" x="700.0" y="505.0" text-anchor="middle"><tspan x="700.0" y="505.0">RMSNorm(h + rᵃℓ)</tspan><tspan x="700.0" y="527.0">Attention → Δaℓ</tspan></text>
<line class="edge blue" x1="800" y1="515" x2="816" y2="515" marker-end="url(#arrow-blue)"/>
<circle class="sum" cx="836" cy="515" r="19"/><text class="sum-label" x="836" y="521.0" text-anchor="middle"><tspan x="836" y="521.0">+</tspan></text>
<line class="edge blue" x1="855" y1="515" x2="870" y2="515" marker-end="url(#arrow-blue)"/>
<rect class="node blue-node" x="870" y="467" width="200" height="96" rx="16"/><text class="label" x="970.0" y="505.0" text-anchor="middle"><tspan x="970.0" y="505.0">RMSNorm(h + rᵐℓ)</tspan><tspan x="970.0" y="527.0">MLP → Δmℓ</tspan></text>
<line class="edge blue" x1="1070" y1="515" x2="1086" y2="515" marker-end="url(#arrow-blue)"/>
<circle class="sum" cx="1106" cy="515" r="19"/><text class="sum-label" x="1106" y="521.0" text-anchor="middle"><tspan x="1106" y="521.0">+</tspan></text>
<line class="edge blue" x1="1125" y1="515" x2="1180" y2="515" marker-end="url(#arrow-blue)"/>
<text class="formula" x="1150" y="488.0" text-anchor="middle"><tspan x="1150" y="488.0">hℓ₊₁</tspan></text>
<rect class="node purple-node" x="570" y="275" width="540" height="80" rx="16"/><text class="formula" x="840.0" y="294.0" text-anchor="middle"><tspan x="840.0" y="294.0">Sources Sℓ</tspan><tspan x="840.0" y="316.0">[eₜ  |  Δa₀, Δm₀, …]</tspan><tspan x="840.0" y="338.0">seed + prior deltas</tspan></text>
<rect class="node purple-node" x="620" y="380" width="160" height="66" rx="16"/><text class="formula" x="700.0" y="403.0" text-anchor="middle"><tspan x="700.0" y="403.0">rᵃℓ = route</tspan><tspan x="700.0" y="425.0">(Sℓ, qᵃℓ)</tspan></text>
<rect class="node purple-node" x="890" y="380" width="160" height="66" rx="16"/><text class="formula" x="970.0" y="403.0" text-anchor="middle"><tspan x="970.0" y="403.0">rᵐℓ = route</tspan><tspan x="970.0" y="425.0">(Sℓ, qᵐℓ)</tspan></text>
<line class="edge purple" x1="700" y1="355" x2="700" y2="378" marker-end="url(#arrow-purple)"/>
<line class="edge purple" x1="970" y1="355" x2="970" y2="378" marker-end="url(#arrow-purple)"/>
<line class="edge purple" x1="700" y1="446" x2="700" y2="465" marker-end="url(#arrow-purple)"/>
<line class="edge purple" x1="970" y1="446" x2="970" y2="465" marker-end="url(#arrow-purple)"/>
<text class="small" x="840.0" y="635.0" text-anchor="middle"><tspan x="840.0" y="635.0">Each branch delta joins Sℓ before the next routed read.</tspan></text>
<path class="edge purple" d="M 310 469 L 310 315 L 568 315" marker-end="url(#arrow-purple)"/>
<text class="small" x="422" y="294.0" text-anchor="middle"><tspan x="422" y="294.0">seed eₜ</tspan></text>
<rect class="node blue-node" x="1215" y="468" width="190" height="94" rx="16"/><text class="formula" x="1310.0" y="505.0" text-anchor="middle"><tspan x="1310.0" y="505.0">Top state</tspan><tspan x="1310.0" y="527.0">hₜᵗᵒᵖ</tspan></text>
<line class="edge blue" x1="1180" y1="515" x2="1213" y2="515" marker-end="url(#arrow-blue)"/>
<rect class="node green-node" x="1460" y="453" width="195" height="124" rx="16"/><text class="label" x="1557.5" y="494.0" text-anchor="middle"><tspan x="1557.5" y="494.0">Final RMSNorm</tspan><tspan x="1557.5" y="516.0">+ tied LM head</tspan><tspan x="1557.5" y="538.0">→ logitsₜ</tspan></text>
<line class="edge blue" x1="1405" y1="515" x2="1458" y2="515" marker-end="url(#arrow-blue)"/>
<rect class="node neutral" x="650" y="760" width="380" height="70" rx="16"/><text class="label" x="840.0" y="796.0" text-anchor="middle"><tspan x="840.0" y="796.0">No cross-column payload</tspan></text>
<line class="divider" x1="60" y1="884" x2="1640" y2="884"/>
<text class="small" x="60" y="918.0" text-anchor="start"><tspan x="60" y="918.0">Purple = zero-init routing. With only seed eₜ, layer-0 attention routing is a no-op.</tspan></text>
</svg>
