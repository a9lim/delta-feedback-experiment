<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950" role="img" aria-labelledby="vanilla-transformer-title vanilla-transformer-desc">
<title id="vanilla-transformer-title">Vanilla transformer</title>
<desc id="vanilla-transformer-desc">Token embedding enters a standard pre-norm residual transformer stack and the top state feeds the language-model head. There is no depth router or recurrent payload.</desc>
<defs>
  <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563a8"/></marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
  <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c86b08"/></marker>
  <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  <style>
    .canvas { fill: #ffffff; }
    .title { font: 600 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526070; }
    .section { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .label { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526070; }
    .formula { font: 500 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #172033; }
    .sum-label { font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .node { stroke-width: 2; }
    .neutral { fill: #f7f9fc; stroke: #9aa7b7; }
    .blue-node { fill: #eaf2ff; stroke: #2563a8; }
    .purple-node { fill: #f2ebff; stroke: #7c3aed; }
    .orange-node { fill: #fff2df; stroke: #c86b08; }
    .green-node { fill: #e5f7f0; stroke: #138a66; }
    .gray-node { fill: #eef2f6; stroke: #64748b; }
    .stack { fill: #fbfcfe; stroke: #9aa7b7; stroke-width: 2; }
    .sum { fill: #ffffff; stroke: #2563a8; stroke-width: 2; }
    .edge { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .blue { stroke: #2563a8; }
    .purple { stroke: #7c3aed; }
    .orange { stroke: #c86b08; }
    .gray { stroke: #64748b; }
    .divider { stroke: #d5dce6; stroke-width: 1.5; }
  </style>
</defs>
<rect class="canvas" width="1700" height="950"/>
<text class="title" x="60" y="62.0" text-anchor="start"><tspan x="60" y="62.0">Vanilla transformer</tspan></text>
<text class="subtitle" x="60" y="101.0" text-anchor="start"><tspan x="60" y="101.0">Baseline · ordinary residual depth · no cross-column state</tspan></text>
<line class="divider" x1="60" y1="132" x2="1640" y2="132"/>
<rect class="node neutral" x="45" y="590" width="110" height="70" rx="16"/><text class="formula" x="100.0" y="615.0" text-anchor="middle"><tspan x="100.0" y="615.0">Token</tspan><tspan x="100.0" y="637.0">xₜ</tspan></text>
<line class="edge blue" x1="155" y1="625" x2="188" y2="625" marker-end="url(#arrow-blue)"/>
<rect class="node blue-node" x="190" y="585" width="190" height="80" rx="16"/><text class="formula" x="285.0" y="615.0" text-anchor="middle"><tspan x="285.0" y="615.0">Embedding</tspan><tspan x="285.0" y="637.0">eₜ</tspan></text>
<line class="edge blue" x1="380" y1="625" x2="498" y2="625" marker-end="url(#arrow-blue)"/>
<text class="section" x="500" y="195.0" text-anchor="start"><tspan x="500" y="195.0">Transformer block ℓ   × L</tspan></text>
<text class="small" x="1190" y="195.0" text-anchor="end"><tspan x="1190" y="195.0">branch deltas update the residual rail</tspan></text>
<text class="small" x="845" y="290.0" text-anchor="middle"><tspan x="845" y="290.0">No source rail  ·  no routed reads</tspan></text>
<path class="edge blue" d="M 620 625 L 620 512" marker-end="url(#arrow-blue)"/>
<path class="edge blue" d="M 980 625 L 980 512" marker-end="url(#arrow-blue)"/>
<rect class="node blue-node" x="550" y="445" width="140" height="80" rx="16"/><text class="label" x="620.0" y="475.0" text-anchor="middle"><tspan x="620.0" y="475.0">RMSNorm</tspan><tspan x="620.0" y="497.0">Attention</tspan></text>
<rect class="node blue-node" x="910" y="445" width="140" height="80" rx="16"/><text class="label" x="980.0" y="475.0" text-anchor="middle"><tspan x="980.0" y="475.0">RMSNorm</tspan><tspan x="980.0" y="497.0">MLP</tspan></text>
<line class="edge blue" x1="500" y1="625" x2="799" y2="625" marker-end="url(#arrow-blue)"/>
<circle class="sum" cx="820" cy="625" r="19"/><text class="sum-label" x="820" y="631.0" text-anchor="middle"><tspan x="820" y="631.0">+</tspan></text>
<line class="edge blue" x1="839" y1="625" x2="1149" y2="625" marker-end="url(#arrow-blue)"/>
<circle class="sum" cx="1170" cy="625" r="19"/><text class="sum-label" x="1170" y="631.0" text-anchor="middle"><tspan x="1170" y="631.0">+</tspan></text>
<path class="edge blue" d="M 690 485 L 820 485 L 820 604" marker-end="url(#arrow-blue)"/>
<path class="edge blue" d="M 1050 485 L 1170 485 L 1170 604" marker-end="url(#arrow-blue)"/>
<text class="formula" x="842" y="460.0" text-anchor="start"><tspan x="842" y="460.0">Δaℓ</tspan></text>
<text class="formula" x="1192" y="460.0" text-anchor="start"><tspan x="1192" y="460.0">Δmℓ</tspan></text>
<text class="small" x="520" y="650.0" text-anchor="start"><tspan x="520" y="650.0">residual stream</tspan></text>
<line class="edge blue" x1="1189" y1="625" x2="1318" y2="625" marker-end="url(#arrow-blue)"/>
<text class="formula" x="1240" y="650.0" text-anchor="middle"><tspan x="1240" y="650.0">hₜᵗᵒᵖ</tspan></text>
<rect class="node green-node" x="1320" y="585" width="160" height="80" rx="16"/><text class="label" x="1400.0" y="615.0" text-anchor="middle"><tspan x="1400.0" y="615.0">Final RMSNorm</tspan><tspan x="1400.0" y="637.0">+ LM head</tspan></text>
<line class="edge blue" x1="1480" y1="625" x2="1518" y2="625" marker-end="url(#arrow-blue)"/>
<rect class="node green-node" x="1520" y="590" width="135" height="70" rx="16"/><text class="formula" x="1587.5" y="615.0" text-anchor="middle"><tspan x="1587.5" y="615.0">Logits</tspan><tspan x="1587.5" y="637.0">logitsₜ</tspan></text>
<line class="divider" x1="60" y1="884" x2="1640" y2="884"/>
<text class="small" x="60" y="918.0" text-anchor="start"><tspan x="60" y="918.0">Blue = ordinary residual computation. One column at position t is shown.</tspan></text>
</svg>
