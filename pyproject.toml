[project]
name = "delta-feedback-experiment"
version = "0.1.0"
description = "Pretraining factorial: Delta Attention Residuals x full-bandwidth latent feedback."
readme = "README.md"
requires-python = ">=3.12"
license = "CC-BY-SA-4.0"
license-files = ["LICENSE"]
authors = [{ name = "a9lim", email = "mx@a9l.im" }]
dependencies = [
    "transformer-experiments>=0.1,<0.2",
    "torch",
    "numpy",
    "transformers",
    "datasets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["delta_feedback_experiment"]
