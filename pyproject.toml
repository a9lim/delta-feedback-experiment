[project]
name = "delta-feedback-experiment"
version = "0.4.0"
description = "A small recurrent model organism for interpretability and latent-computation monitoring."
readme = "README.md"
requires-python = ">=3.12"
license = "CC-BY-SA-4.0"
license-files = ["LICENSE"]
authors = [{ name = "a9lim", email = "mx@a9l.im" }]
dependencies = [
    "transformer-experiments>=0.1,<0.2",
    "torch>=2.14,<2.15",
    "numpy",
    "transformers",
    "datasets",
]

[project.optional-dependencies]
data-build = [
    "datasets==5.0.1",
    "transformers==5.16.1",
    "tokenizers==0.23.1",
    "huggingface-hub==1.29.0",
]
cuda = [
    "cut-cross-entropy",
    "flash-linear-attention[cuda]",
]
kernel-bench = [
    "nvidia-cutlass-operators[torch]==0.2.0; sys_platform == 'linux'",
    "nvidia-cutlass-dsl[cu13]==4.7.1; sys_platform == 'linux'",
]

[project.scripts]
df = "delta_feedback_experiment.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The CUDA kernels come from the workspace forks checked out as root submodules
# under vendor/; the root repository's submodule pointers are their only pin.
[tool.uv.sources]
cut-cross-entropy = { path = "../vendor/ml-cross-entropy", editable = true }
flash-linear-attention = { path = "../vendor/flash-linear-attention", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["delta_feedback_experiment"]
