# Primary sources used by the current experiment. Fetched Markdown/PDF copies
# are regenerable and remain untracked:
#   python -m transformer_experiments.references
references:
  - arxiv: "2607.27230"
    slug: luo2026-multi-head-attention-residuals
    note: >
      Defines the multi-head depth-routing operation: a width-D query is split
      into contiguous feature groups, each group independently normalizes over
      depth sources, and the routed groups are concatenated without an output
      projection. The current design combines this headwise operation with
      additive delta sources.

  - arxiv: "2605.18855"
    slug: luo2026-delta-attention-residuals
    note: >
      Defines additive routing over residual deltas, with RMS-normalized keys,
      raw values, zero-initialized queries, and per-sublayer or block-delta
      source layouts. The 220M experiment uses per-sublayer sources; the
      flagship uses one completed delta per four-layer cell and one evolving
      current-cell partial delta.

  - arxiv: "2510.26692"
    slug: kimi2025-kimi-linear
    note: >
      Defines Kimi Delta Attention, its chunkwise and recurrent forms,
      channel-wise decay, causal short convolutions, sigmoid output gate, NoPE
      global-attention layers, and the empirically selected 3:1 KDA-to-global
      MLA cadence. The flagship keeps those KDA and cadence choices but uses
      dense global GQA instead of MLA.

  - url: https://huggingface.co/Qwen/Qwen3-Next-80B-A3B-Instruct/blob/main/config.json
    slug: qwen2025-qwen3-next-config
    note: >
      The official released Qwen3-Next configuration sets the full-attention
      interval to four and uses fewer KV than query heads in those global
      layers. This is interval-four and GQA precedent only; Qwen3-Next uses
      Gated DeltaNet where the flagship uses KDA.

  - url: https://github.com/huggingface/transformers/blob/main/src/transformers/models/qwen3_next/modeling_qwen3_next.py
    slug: qwen2025-qwen3-next-attention
    note: >
      The released Qwen3-Next attention implementation projects a gate beside
      each query-head coordinate and applies its sigmoid elementwise to the
      concatenated attention output before the output projection. The flagship
      adopts this gate; the screen and token ladder remain ungated.

  - arxiv: "2608.08888"
    slug: wang2026-full-bandwidth-transformer
    note: >
      Defines latent feedback through the asymmetric state-value/token-gate
      fusion, Jacobi multi-pass training, prefix mixin, recurrent-state jitter,
      the 75/22/3 pass mixture, contraction diagnostics, depth scaling, and the
      shared pretraining recipe used by every arm.

  - arxiv: "2510.05491"
    slug: li2025-normuon
    note: >
      Defines NorMuon: momentum, Newton-Schulz orthogonalization, neuron-wise
      second-moment normalization, and global update rescaling. The experiment
      applies it to non-embedding two-dimensional weights and uses Adam for the
      remaining parameters.

  - arxiv: "2603.15031"
    slug: kimi2026-attention-residuals
    note: >
      Defines the cumulative-state Attention Residuals substrate needed to
      distinguish replacement routing from the additive delta routing used in
      this experiment.
