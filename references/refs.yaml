# Primary sources used by the current experiment. Fetched Markdown/PDF copies
# are regenerable and remain untracked:
#   python -m transformer_experiments.references
references:
  - arxiv: "2607.27230"
    slug: luo2026-multi-head-attention-residuals
    note: >
      Defines the multi-head depth-routing operation: a width-D query is split
      into contiguous feature groups, each group independently normalizes over
      depth sources, and the routed groups are concatenated without an output
      projection. The current design combines this headwise operation with
      additive delta sources.

  - arxiv: "2605.18855"
    slug: luo2026-delta-attention-residuals
    note: >
      Defines additive routing over residual deltas, with RMS-normalized keys,
      raw values, zero-initialized queries, and per-sublayer or block-delta
      source layouts. The current experiment uses one completed delta per
      four-layer cell and one evolving current-cell partial delta at every
      scale.

  - arxiv: "2510.26692"
    slug: kimi2025-kimi-linear
    note: >
      Defines Kimi Delta Attention, its chunkwise and recurrent forms,
      channel-wise decay, causal short convolutions, sigmoid output gate, NoPE
      global-attention layers, the empirically selected 3:1 KDA-to-global MLA
      cadence, fixed 128-dimensional key/value heads, and the width-1,536
      scaling-law point with 20 heads. Its scaling convention reports active
      parameters without embedding parameters. The screen and flagship keep
      the KDA substrate and cadence inside PKDA but use dense global GQA
      instead of MLA.

  - url: https://huggingface.co/moonshotai/Kimi-Linear-48B-A3B-Instruct/blob/e1df551a447157d4658b573f9a695d57658590e9/config.json
    slug: kimi2025-kimi-linear-config
    note: >
      The released Kimi Linear configuration independently fixes BF16 model
      dtype, normal initialization with standard deviation 0.02, 128-wide KDA
      heads, convolution width 4, and a KDA projection width larger than the
      residual width. It is released-model precedent for those operational
      choices, not a geometry reproduction target.

  - arxiv: "2604.21100"
    slug: tumma2026-preconditioned-deltanet
    note: >
      Defines Preconditioned KDA: an apply-to-key diagonal approximation to the
      inverse key Gram, with independent preconditioner decay and gain, a
      stable log-space squash onto [1/x, x], chunkwise and recurrent forms, and
      language-model evidence at 340M and 1B. It supplies the preconditioner,
      not the screen's head-count rule: the screen uses 10-by-128 to preserve
      the flagship Kimi prior's 5/3 recurrent projection ratio. Both scales use
      the registered x=1.5 PKDA parameterization rather than unpreconditioned
      KDA.

  - url: https://github.com/fla-org/flash-linear-attention/blob/35dceaee5408e69a555fec34cb215c93c375dabe/fla/layers/precond_kda.py
    slug: fla2026-preconditioned-kda
    note: >
      The upstream PrecondKDA reference layer defines the independent ATK gate
      projections and initialization, bounded preconditioner, auxiliary A-state
      cache, chunkwise training kernel, and fused-recurrent decoding kernel that
      the screen and flagship implementations reproduce and qualify. Its output
      norm defaults to epsilon 1e-5; this experiment deliberately uses its
      unified model-wide epsilon 1e-6 instead.

  - url: https://github.com/fla-org/flash-linear-attention/blob/35dceaee5408e69a555fec34cb215c93c375dabe/fla/modules/conv/short_conv.py
    slug: fla2026-short-convolution
    note: >
      The released KDA/PKDA short convolution is a bias-free depthwise Conv1d
      with causal history of kernel-size minus one and does not override the
      framework Conv1d initialization. Both scales preserve those weight,
      cache-shape, and initialization semantics.

  - url: https://github.com/fla-org/flash-linear-attention/blob/35dceaee5408e69a555fec34cb215c93c375dabe/fla/ops/precond_kda/chunk.py
    slug: fla2026-preconditioned-kda-chunk
    note: >
      The upstream PKDA training operator fixes chunk size 64, returns outputs
      in the activation dtype, retains FP32 recurrent boundary states, and
      recomputes large intermediates in backward by default. These are the
      screen and flagship kernel and precision contracts.

  - url: https://huggingface.co/Qwen/Qwen3-Next-80B-A3B-Instruct/blob/main/config.json
    slug: qwen2025-qwen3-next-config
    note: >
      The official released Qwen3-Next configuration sets the full-attention
      interval to four and uses fewer KV than query heads in those global
      layers. This is interval-four and GQA precedent only; Qwen3-Next uses
      Gated DeltaNet where this experiment uses PKDA.

  - url: https://github.com/huggingface/transformers/blob/main/src/transformers/models/qwen3_next/modeling_qwen3_next.py
    slug: qwen2025-qwen3-next-attention
    note: >
      The released Qwen3-Next attention implementation projects a gate beside
      each query-head coordinate and applies its sigmoid elementwise to the
      concatenated attention output before the output projection. Every hybrid
      screen arm and the flagship adopt this gate; only the external screen
      `vanilla` control remains ungated.

  - arxiv: "2608.08888"
    slug: wang2026-full-bandwidth-transformer
    note: >
      Defines latent feedback through the asymmetric state-value/token-gate
      fusion, Jacobi multi-pass training, prefix mixin, recurrent-state jitter,
      the 75/22/3 pass mixture, contraction diagnostics, depth scaling, and the
      width-1,536 / intermediate-6,656 trunk geometry. The screen uses its exact
      half-width intermediate of 3,328. It also supplies the shared pretraining
      recipe used by every arm.

  - arxiv: "2510.05491"
    slug: li2025-normuon
    note: >
      Defines NorMuon: momentum, Newton-Schulz orthogonalization, neuron-wise
      second-moment normalization, and global update rescaling. NorMuon supplies
      the base matrix direction inside NorMuonH; Hyperball normalization replaces
      its global rescaling before the parameter update.

  - url: https://github.com/zichongli5/NorMuon/blob/c6989a8354730695d9f5a9faa6c55eeb24865209/normuon.py#L35-L42
    slug: li2025-normuon-implementation
    note: >
      The released NorMuon implementation updates the EMA momentum, forms the
      default Nesterov direction by blending the current gradient with that
      updated momentum, and only then applies Newton-Schulz orthogonalization.
      NorMuonH preserves this ordering before its row normalization and
      Hyperball projection.

  - url: https://github.com/pytorch/pytorch/blob/v2.9.1/torch/optim/nadam.py#L380-L531
    slug: pytorch291-nadam-implementation
    note: >
      Defines the foreach NAdam update used for semantic-scale parameters:
      fixed first and second moments, the scheduled Nesterov momentum cache,
      cumulative momentum-product bias correction, and the default momentum
      decay of 0.004. The experiment uses this implementation without weight
      decay.

  - arxiv: "2606.16899"
    slug: chen2026-hyperball
    note: >
      Defines Hyperball's fixed initial Frobenius radius, unit-Frobenius base
      update, dimensionless relative step, and exact radial projection. The
      experiment applies it to every NorMuon matrix except the semantic FBT
      token-gate projection, uses NAdam for all semantic-scale parameters,
      and uses no weight decay.

  - arxiv: "2603.15031"
    slug: kimi2026-attention-residuals
    note: >
      Defines the cumulative-state Attention Residuals substrate needed to
      distinguish replacement routing from the additive delta routing used in
      this experiment.

  - arxiv: "2502.05171"
    slug: geiping2025-recurrent-depth
    note: >
      Defines the prelude/recurrent-core/coda decoder, the log-normal Poisson
      draw of the iteration count, truncated backpropagation through the last
      iterations, a KV cache budget shared across iterations, and the
      zero-shot warm start of the next token's state. The depth-recurrent arm
      takes the tied core, the iteration draw, and the shared-cache idea; it
      replaces the adapter with MHDB reads, the random initial state with the
      prelude output, the residual sandwich norm with branch-output norms, and
      the untrained warm start with the trained FBT payload.
