# Load-bearing papers for this experiment. Markdown copies live beside this
# file, gitignored — (re)fetch them with:
#   python -m transformer_experiments.references
references:
  - arxiv: "2607.27230"
    slug: luo2026-multi-head-attention-residuals
    note: >
      Parent 1 — the multi-head depth axis. Reshape one D-dimensional routing
      query into H contiguous channel groups, each with an independent
      softmax over depth sources; full-width RMSNorm is shared across heads
      and there is no output projection or parameter increase. Its released
      code includes the additive delta_mh variant used here. Our fixed scaling
      rule is H = KV heads (4 at 220M, 8 at the flagship).
  - arxiv: "2605.18855"
    slug: luo2026-delta-attention-residuals
    note: >
      Depth-routing substrate for MHDAR. Route RMS-normed sublayer deltas (not
      redundant cumulative states) with additive zero-init softmax routing;
      cumulative/replacement routing collapses (max weight ~0.2) and degrades
      past ~1B. Gains 1.7-8.2% val PPL, 220M-7.6B. Our trial config is their
      220M (Qwen3 tokenizer, d=768, L=12); Delta Block is the flagship
      coarsening (533M ablation shows block-size robustness).
  - arxiv: "2608.08888"
    slug: wang2026-full-bandwidth-transformer
    note: >
      Parent 2 — the token-time axis. Feed the previous top-layer state back
      to layer 0 through an asymmetric GLU (state on value path, token as
      gate — mandatory read). Jacobi multi-pass training, 75/22/3 pass
      mixture (3% three-pass turns the feedback map into a contraction),
      prefix mixin, jitter, depth scaling, tied embeddings. Binding recipe
      for all our arms; flagship matches their 1B/400B-token scale and
      1536x24 trunk. Their open question — which injection form is best —
      is measured by the hard DF spine versus the optional DF-soft companion.
  - arxiv: "2510.13879"
    slug: galashov2025-catch-your-breath
    note: >
      Phase-2 extension core. CYB: per-token adaptive pauses via a
      marginal-likelihood loss — the model emits <don't-know> to take
      another pause slot; loss −log E_{i~Pr(S|d,ω)}[γ_i·t_i] over the
      W_max prediction sites, fully parallel at train and inference
      (pauses share the real token's position index). 2.7–3.6% PPL over
      fixed-pause TBYS (Gemma 2B/4B, C4; CYB@1 pause beats TBYS@3), ~33%
      of baseline data to match it; pause use stays judicious even
      undiscounted. Their pauses write KV and inflate context W_max× —
      our recurrent-pause variant masks them from future attention and
      chains through the payload instead.
  - arxiv: "2310.02226"
    slug: goyal2023-pause-tokens
    note: >
      Phase-2 lineage — fixed pause tokens (the TBYS recipe CYB
      supersedes). Core carry-over: pauses must be pretrained in,
      matching our from-scratch setting. Under latent feedback,
      consecutive pauses chain full-depth through the payload (a
      horizontally unrolled loop transformer), supplying the serial
      depth pauses lack alone. Loose conceptual parallel to
      recirculated-dot-experiment.
  - arxiv: "2510.05491"
    slug: li2025-normuon
    note: >
      Recipe reference — the matrix optimizer FBT binds us to. NorMuon =
      Muon (EMA momentum beta1 0.95, 5-step Newton-Schulz) plus neuron-wise
      second moments (beta2 0.95, per-row mean of the orthogonalized
      update's squares) normalizing rows before a global rescale to
      Frobenius norm 0.2*sqrt(m*n); decoupled weight decay. Applied to 2D
      hidden matrices only; Adam handles embeddings/unembedding, vectors,
      scalars. FBT's lr 1e-2 / wd 0.01 override the paper's own defaults.
  - arxiv: "2603.15031"
    slug: kimi2026-attention-residuals
    note: >
      Context — DAR's substrate. Original Attention Residuals (cumulative
      sources, replacement routing, reset); needed when implementing the
      routing module and understanding what DAR fixed. NB: arXiv has no full
      HTML rendering (fetched copy is a metadata stub) — use the PDF, or
      DAR's Appendix B, which reproduces the pseudocode and differences.
